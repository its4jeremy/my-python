services:
  - type: web
    name: pastpaper-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --access-logfile - --error-logfile - app:app
    healthCheckPath: /topics
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
